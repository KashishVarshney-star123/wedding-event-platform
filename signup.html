<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | WedVista</title>

    <link rel="stylesheet" href="signup.css">

</head>

<body>


    <!-- Navigation -->

    <nav class="navbar">

        <div class="nav-container">

            <a href="index.html" class="logo">
                WedVista
            </a>


            <div class="nav-links">

                <a href="index.html">Home</a>

                <a href="#">Services</a>

                <a href="#">About</a>

                <a href="#">Contact</a>

            </div>


            <div class="nav-right">

                <span>
                    Already have an account?
                </span>

                <a href="login.html" class="login-link">
                    Login
                </a>

            </div>

        </div>

    </nav>


    <!-- Signup -->

    <main class="signup-section">

        <div class="signup-card">


            <div class="signup-heading">

                <p class="small-heading">
                    JOIN WEDVISTA
                </p>

                <h1>
                    Create Your Account
                </h1>

                <p>
                    Start planning your perfect event with WedVista.
                </p>

            </div>


            <form>


                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email address"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <div class="terms">

                    <label>

                        <input type="checkbox" required>

                        I agree to the terms and conditions.

                    </label>

                </div>


                <button
                    type="submit"
                    class="signup-button">

                    Create Account

                </button>


            </form>


            <div class="bottom-login">

                <p>
                    Already have an account?
                </p>

                <a href="login.html">
                    Login to WedVista
                </a>

            </div>


        </div>

    </main>


    <footer>

        © 2026 WedVista. All rights reserved.

    </footer>


</body>

</html>
