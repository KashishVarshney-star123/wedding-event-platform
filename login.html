<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WedVista — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <main class="page">

    <div class="circle one"></div>
    <div class="circle two"></div>

    <div class="auth-card">

      <section class="hero">
        <div class="brand">WedVista</div>

        <div class="hero-content">
          <div class="small-text">Your wedding, beautifully planned</div>
          <h1>Begin your<br>forever.</h1>
          <p>Plan, organize and celebrate every beautiful moment of your wedding — all in one place.</p>
          <div class="heart">&hearts;</div>
        </div>
      </section>

      <section class="form-section">

        <div class="form-header">
          <h2>Welcome back</h2>
          <p>Sign in to continue planning your special day.</p>
        </div>

        <form class="form" id="loginForm">
          <div class="input-group">
            <label>Email Address</label>
            <div class="input-wrapper">
              <span>&#9993;</span>
              <input type="email" id="loginEmail" placeholder="you@example.com" required>
            </div>
          </div>

          <div class="input-group">
            <label>Password</label>
            <div class="input-wrapper">
              <span>&#9679;</span>
              <input type="password" id="loginPassword" placeholder="Enter your password" required>
            </div>
          </div>

          <div class="row">
            <label class="remember">
              <input type="checkbox">
              Remember me
            </label>
            <a href="#" class="forgot">Forgot password?</a>
          </div>

          <p class="form-message" id="loginMessage"></p>
          <button class="submit-btn" type="submit">Sign In</button>
        </form>

        <p class="switch-link">New here? <a href="signup.html">Create an account</a></p>

      </section>

    </div>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
