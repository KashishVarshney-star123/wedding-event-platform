<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WedVista — Browse Vendors</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style/style.css">
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <a href="index.html" class="brand">WedVista</a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="signup.html" class="nav-cta">Sign Up</a>
    </nav>
  </header>

  <div class="container">
    <h1>Browse vendors</h1>
    <p class="subtitle">Find and compare verified vendors for your event.</p>

    <!-- Filter bar -->
    <div class="filter-bar">
      <select id="category">
        <option value="All">All categories</option>
        <option value="Photographer">Photographer</option>
        <option value="Caterer">Caterer</option>
        <option value="Decorator">Decorator</option>
        <option value="Venue">Venue</option>
        <option value="DJ">DJ</option>
        <option value="Makeup">Makeup</option>
      </select>
      <input type="text" id="location" placeholder="Location">
      <input type="number" id="minBudget" placeholder="Min budget" min="0">
      <input type="number" id="maxBudget" placeholder="Max budget" min="0">
      <button type="button" id="searchBtn" class="btn-maroon">Search</button>
      <button type="button" id="resetBtn" class="btn-maroon btn-gray">Reset</button>
    </div>

    <!-- Vendor Grid (filled by filter.js) -->
    <div class="vendor-grid" id="vendorGrid"></div>
  </div>

  <footer class="footer">
    <p>© 2026 WedVista. Wedding & Event Planning Management Platform.</p>
  </footer>

  <script src="filter.js" defer></script>
</body>
</html>
